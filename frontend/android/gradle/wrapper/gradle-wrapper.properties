distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# 官方地址 services.gradle.org 会把下载**重定向到 github.com**，
# 而本机 github.com 不通（其它源都通）→ 表现为 UnknownHostException: github.com，
# 看起来像 DNS 坏了，实际是那个重定向目标被打掉了。改用国内镜像。
distributionUrl=https\://mirrors.cloud.tencent.com/gradle/gradle-8.2.1-all.zip
networkTimeout=30000
validateDistributionUrl=false
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
