# 项目相关配置
ruoyi:
  # 名称
  name: RuoYi
  # 版本
  version: 3.9.2
  # 版权年份
  copyrightYear: 2026
  # 文件路径 示例（ Windows配置D:/ruoyi/uploadPath，Linux配置 /home/ruoyi/uploadPath）
  profile: D:/ruoyi/uploadPath
  # 获取ip地址开关
  addressEnabled: false
  # 验证码类型 math 数字计算 char 字符验证
  captchaType: math

# 开发环境配置
server:
  # 服务器的HTTP端口；实训包使用独立端口，避免占用本机已有项目
  port: 18080
  servlet:
    # 应用的访问路径
    context-path: /
  tomcat:
    # tomcat的URI编码
    uri-encoding: UTF-8
    # 连接数满后的排队数，默认为100
    accept-count: 1000
    threads:
      # tomcat最大线程数，默认为200
      max: 800
      # Tomcat启动初始化的线程数，默认值10
      min-spare: 100

# 日志配置
logging:
  level:
    com.ruoyi: debug
    org.springframework: warn

# 用户配置
user:
  password:
    # 密码最大错误次数
    maxRetryCount: 5
    # 密码锁定时间（默认10分钟）
    lockTime: 10

# Spring配置
spring:
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  profiles:
    active: druid
  # 文件上传
  servlet:
    multipart:
      # 单个文件大小
      max-file-size: 10MB
      # 设置总上传的文件大小
      max-request-size: 20MB
  # 服务模块
  devtools:
    restart:
      # 热部署开关
      enabled: true
  data:
    # redis 配置
    redis:
      # 地址
      host: localhost
      # 独立 Redis 端口，避免占用本机已有 Redis
      port: 16379
      # 数据库索引
      database: 0
      # 密码
      password:
      # 连接超时时间
      timeout: 10s
      lettuce:
        pool:
          # 连接池中的最小空闲连接
          min-idle: 0
          # 连接池中的最大空闲连接
          max-idle: 8
          # 连接池的最大数据库连接数
          max-active: 8
          # #连接池最大阻塞等待时间（使用负值表示没有限制）
          max-wait: -1ms

# token配置
token:
  # 令牌自定义标识
  header: Authorization
  # 令牌密钥
  secret: abcdefghijklmnopqrstuvwxyz
  # 令牌有效期（默认30分钟）
  expireTime: 30

# MyBatis配置
mybatis:
  # 搜索指定包别名
  typeAliasesPackage: com.ruoyi.**.domain
  # 配置mapper的扫描，找到所有的mapper.xml映射文件
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  # 加载全局的配置文件
  configLocation: classpath:mybatis/mybatis-config.xml

# PageHelper分页插件
pagehelper:
  helperDialect: mysql
  supportMethodsArguments: true
  params: count=countSql

# Springdoc配置
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
  group-configs:
    - group: 'default'
      display-name: '测试模块'
      paths-to-match: '/**'
      packages-to-scan: com.ruoyi.web.controller.tool

# 田诊助手 AI 配置
tz:
  ai:
    # 总开关。关掉则只走「预置映射 + 知识库检索」，功能完整、演示照常
    enabled: true
    # 服务商标识，写进 tz_ai_call_log，用来分辨结果出自哪家
    provider: zhipu
    # OpenAI 兼容接口的基础地址（不含 /chat/completions）
    #
    # 【换服务商要改四项，不是一项】provider / base-url / vision-model / text-model
    # 四者必须同一家：模型名是各家独有的，只改 base-url 一定 404。
    #   智谱 GLM（当前）https://open.bigmodel.cn/api/paas/v4
    #      免费：glm-4.6v-flash（视觉）/ glm-4.7-flash（文本）
    #   阿里百炼        https://dashscope.aliyuncs.com/compatible-mode/v1
    #      qwen-vl-plus / qwen-plus（新用户 50 万 token 限免，非永久免费）
    #   火山方舟        https://ark.cn-beijing.volces.com/api/v3
    #      豆包视觉模型（每模型 50 万 token 免费额度）
    base-url: https://open.bigmodel.cn/api/paas/v4
    # 【重要】不要把 key 明文写在这里。启动前设置环境变量 TZ_AI_API_KEY 即可。
    # 留空时系统自动降级为预置映射模式，前后端都会明确标出「当前未接入大模型」。
    api-key: ${TZ_AI_API_KEY:}
    # 多模态模型（要能读图）。
    #
    # 选 4.1v-thinking 而不是文档推荐的 4.6v，是实测选的 —— 两个模型在同一时间窗口里
    # 交替各打 8 次（同一张图、同样的请求）：
    #     glm-4.6v-flash             成功 1/8，7 次 429，成功那次 7.9 s
    #     glm-4.1v-thinking-flash    成功 8/8，无 429，均值 4.1 s，8 次全答「柑橘溃疡病」
    # 文本那边是同一个规律（见下方 text-model 的注释）：免费额度优先给了老一代模型。
    #
    # 图片是以 base64 data URL 内联发的，4.1v-thinking 收（实测 18/18）。
    # 另：老的 glm-4v-flash 不收 base64（只吃公网图片 URL，会 400），且输出上限 1K token
    # 装不下四段式 JSON，不要用。
    vision-model: glm-4.1v-thinking-flash
    # 纯文本模型（问答与报告润色）。
    # 用 250414 这一代而不是更新的 glm-4.7-flash，是实测选的：同样打 10 次，
    # glm-4.7-flash 只成功 2 次（均值 3.4 s），本模型 10 次全通（均值 0.8 s）——
    # 免费档里最新最强的那个，也正是被抢得最狠的那个。glm-4.5-flash 已下线，别写回旧 id。
    text-model: glm-4-flash-250414
    # 读图偏慢，超时给足，别用默认值
    connect-timeout-seconds: 10
    timeout-seconds: 90
    # 普通故障（5xx / 超时 / 网络抖动）的重试次数，不含首次
    max-retries: 1
    # 限流（HTTP 429）的额外重试次数。与 max-retries 分开算，因为两者代价差两个数量级：
    # 超时一次要等 90 秒，而限流返回只要 200-500 ms。免费档被限流是常态，
    # 不给它单独预算，等于默认把「模型结论」让给「知识库降级」。
    rate-limit-retries: 4
    # 限流退避基数（毫秒），第 n 次等待 n × 该值 → 400/800/1200/1600，最坏多花 4 秒
    rate-limit-backoff-ms: 400
    # 诊断要稳定，温度取低值
    temperature: 0.2
    # 检索增强带几条知识库条目进提示词
    rag-top-n: 3
    # 低于此置信度不采信大模型结论，转降级路径
    min-confidence: 60
    # 剂量校验。这是合规硬约束，除非专门调试，否则不要关
    dosage-guard-enabled: true
    disclaimer: 本结论由 AI 辅助生成，仅作为巡田参考，不能替代农技人员的现场诊断与农药标签说明。

# 防盗链配置
referer:
  # 防盗链开关
  enabled: false
  # 允许的域名列表
  allowed-domains: localhost,127.0.0.1,ruoyi.vip,www.ruoyi.vip

# 防止XSS攻击
xss:
  # 过滤开关
  enabled: true
  # 排除链接（多个用逗号分隔）
  excludes: /system/notice
  # 匹配链接
  urlPatterns: /system/*,/monitor/*,/tool/*
